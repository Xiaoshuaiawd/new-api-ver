        values: '1x10'
      - series: 'pg_stat_database_numbackends{cluster="test",job="postgres-exporter",instance="postgres-2",datname="new-api"}'
        values: '96x10'
      - series: 'pg_settings_max_connections{cluster="test",job="postgres-exporter",instance="postgres-2"}'
        values: '100x10'
      - series: 'redis_memory_used_bytes{cluster="test",job="redis-exporter",instance="redis-2"}'
        values: '96x10'
      - series: 'redis_memory_max_bytes{cluster="test",job="redis-exporter",instance="redis-2"}'
        values: '100x10'
      - series: 'redis_evicted_keys_total{cluster="test",job="redis-exporter",instance="redis-2"}'
        values: '0+1x10'
      - series: 'redis_rejected_connections_total{cluster="test",job="redis-exporter",instance="redis-2"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: NewAPIHostCPUCritical
        exp_alerts:
          - exp_labels:
              cluster: test
              instance: host-2
              job: node-exporter
              severity: critical
            exp_annotations:
              summary: 主机 CPU 使用率过高
              description: 主机 host-2 的 CPU 使用率持续超过 95%，请检查高负载进程、上游重试和扩容需求。
      - eval_time: 6m
        alertname: NewAPIHostMemoryCritical
        exp_alerts:
          - exp_labels:
              cluster: test
              instance: host-2
              job: node-exporter
              severity: critical
            exp_annotations:
              summary: 主机可用内存不足
              description: 主机 host-2 的可用内存持续低于 5%，请检查内存占用和 OOM 风险。
      - eval_time: 6m
        alertname: NewAPIHostFilesystemSpaceCritical
        exp_alerts:
          - exp_labels:
              cluster: test
              device: sda
              fstype: ext4
              instance: host-2
              job: node-exporter
              mountpoint: /
              severity: critical
            exp_annotations:
              summary: 主机磁盘空间不足
              description: 主机 host-2 的文件系统 / 可用空间持续低于 5%，请立即清理或扩容磁盘。
      - eval_time: 2m
        alertname: NewAPIHostFilesystemReadOnly
        exp_alerts:
          - exp_labels:
              cluster: test
              device: sda
              fstype: ext4
              instance: host-2
              job: node-exporter
              mountpoint: /
              severity: critical
            exp_annotations:
              summary: 主机文件系统变为只读
              description: 主机 host-2 的文件系统 / 已变为只读，请立即检查磁盘和宿主机。
      - eval_time: 6m
        alertname: NewAPIPostgresConnectionsCritical
        exp_alerts:
          - exp_labels:
              cluster: test
              instance: postgres-2
              job: postgres-exporter
              severity: critical
            exp_annotations:
              summary: PostgreSQL 连接数接近上限
              description: PostgreSQL 实例 postgres-2 的连接数持续超过最大连接数的 95%，请检查慢查询、连接泄漏和连接池设置。
      - eval_time: 6m
        alertname: NewAPIRedisMemoryCritical
        exp_alerts:
          - exp_labels:
              cluster: test
              instance: redis-2
              job: redis-exporter
              severity: critical
            exp_annotations:
              summary: Redis 内存接近上限
              description: Redis 实例 redis-2 的内存使用持续超过 maxmemory 的 95%，请检查淘汰策略和容量。
      - eval_time: 6m
        alertname: NewAPIRedisEvictionsHigh
        exp_alerts:
          - exp_labels:
              cluster: test
              instance: redis-2
              job: redis-exporter
              severity: warning
            exp_annotations:
              summary: Redis 正在淘汰键
              description: Redis 实例 redis-2 在最近 5 分钟持续发生键淘汰，请检查内存上限和缓存容量。
      - eval_time: 3m
        alertname: NewAPIRedisRejectedConnections
        exp_alerts:
          - exp_labels:
              cluster: test
              instance: redis-2
              job: redis-exporter
              severity: critical
            exp_annotations:
              summary: Redis 拒绝客户端连接
              description: Redis 实例 redis-2 持续拒绝客户端连接，请立即检查 maxclients、连接泄漏和服务负载。

