              description: 实例 app-critical 的进程 CPU 使用率持续超过 GOMAXPROCS 的 95%，请立即检查热点、死循环和扩容需求。

  - name: task completion and polling alerts require meaningful volume
    interval: 1m
    input_series:
      - series: 'newapi_task_completions_total{cluster="test",job="new-api",instance="app-1",platform="video",result="success"}'
        values: '0+12x25'
      - series: 'newapi_task_completions_total{cluster="test",job="new-api",instance="app-1",platform="video",result="failure"}'
        values: '0+8x25'
      - series: 'newapi_task_poll_total{cluster="test",job="new-api",instance="app-1",platform="video",result="success"}'
        values: '0+70x25'
      - series: 'newapi_task_poll_total{cluster="test",job="new-api",instance="app-1",platform="video",result="error"}'
        values: '0+30x25'
    alert_rule_test:
      - eval_time: 21m
        alertname: NewAPITaskCompletionRateLow
        exp_alerts:
          - exp_labels:
              cluster: test
              job: new-api
              platform: video
              severity: warning
            exp_annotations:
              summary: 异步任务完成成功率偏低
              description: 平台 video 的 15 分钟任务完成成功率低于 90%，请检查上游任务结果、结算和状态回写。
      - eval_time: 16m
        alertname: NewAPITaskPollErrorsHigh
        exp_alerts:
          - exp_labels:
              cluster: test
              job: new-api
              platform: video
              severity: warning
            exp_annotations:
              summary: 异步任务轮询错误率偏高
              description: 平台 video 的 5 分钟轮询错误率超过 20%，请检查上游任务查询接口、网络和凭据。
