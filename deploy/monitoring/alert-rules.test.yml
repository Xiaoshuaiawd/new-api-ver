        values: '0x10'
      - series: 'node_cpu_seconds_total{cluster="test",job="node-exporter",instance="host-2",cpu="0",mode="idle"}'
        values: '0x10'
      - series: 'node_memory_MemAvailable_bytes{cluster="test",job="node-exporter",instance="host-2"}'
        values: '4x10'
      - series: 'node_memory_MemTotal_bytes{cluster="test",job="node-exporter",instance="host-2"}'
        values: '100x10'
