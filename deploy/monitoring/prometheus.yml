global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: default

rule_files:
  - /etc/prometheus/rules/recording-rules.yml
  - /etc/prometheus/rules/alert-rules.yml
  - /etc/prometheus/rules/relay-latency-thresholds.yml
  - /etc/prometheus/rules/relay-concurrency-thresholds.yml
  - /etc/prometheus/rules/channel-latency-thresholds.yml
  - /etc/prometheus/rules/channel-concurrency-thresholds.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          cluster: default
          instance: prometheus

  - job_name: new-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/new-api-bearer-token
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          cluster: default
          instance: new-api-1

  - job_name: feishu-alert-webhook
    static_configs:
      - targets:
          - feishu-alert-webhook:8080
        labels:
          cluster: default
          instance: feishu-alert-webhook

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          cluster: default
          instance: host-1

  - job_name: postgres-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/postgres-exporter.yml

  - job_name: mysql-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/mysql-exporter.yml

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          cluster: default
          instance: redis-1
