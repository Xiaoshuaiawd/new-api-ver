groups:
  - name: newapi-traffic
    rules:
      - record: newapi:relay_request_rate:5m
        expr: sum by (cluster, job) (rate(newapi_relay_requests_total[5m]))

      - record: newapi:relay_request_increase:5m
        expr: sum by (cluster, job) (increase(newapi_relay_requests_total[5m]))

      - record: newapi:relay_request_increase_by_format:5m
        expr: sum by (cluster, job, relay_format) (increase(newapi_relay_requests_total[5m]))

      - record: newapi:relay_inflight_by_format
        expr: sum by (cluster, job, relay_format) (newapi_relay_inflight)

      - record: newapi:relay_success_ratio:5m
        expr: sum by (cluster, job) (rate(newapi_relay_requests_total{result="success"}[5m])) / clamp_min(sum by (cluster, job) (rate(newapi_relay_requests_total[5m])), 0.000001)

      - record: newapi:relay_error_increase:5m
        expr: sum by (cluster, job, error_type) (increase(newapi_relay_requests_total{result="failure"}[5m]))

      - record: newapi:relay_error_ratio:5m
        expr: sum by (cluster, job, error_type) (rate(newapi_relay_requests_total{result="failure"}[5m])) / on (cluster, job) group_left clamp_min(sum by (cluster, job) (rate(newapi_relay_requests_total[5m])), 0.000001)

      - record: newapi:channel_success_rpm:5m
        expr: sum by (cluster, job, channel_id) (rate(newapi_channel_attempts_total{result="success"}[5m])) * 60

      - record: newapi:channel_attempt_rpm:5m
        expr: sum by (cluster, job, channel_id) (rate(newapi_channel_attempts_total[5m])) * 60

      - record: newapi:channel_attempt_increase:5m
        expr: sum by (cluster, job, channel_id) (increase(newapi_channel_attempts_total[5m]))

      - record: newapi:channel_success_increase:5m
        expr: sum by (cluster, job, channel_id) (increase(newapi_channel_attempts_total{result="success"}[5m]))

      - record: newapi:channel_failure_ratio:5m
        expr: sum by (cluster, job, channel_id) (rate(newapi_channel_attempts_total{result="failure"}[5m])) / clamp_min(sum by (cluster, job, channel_id) (rate(newapi_channel_attempts_total[5m])), 0.000001)

      - record: newapi:channel_retry_ratio:5m
        expr: sum by (cluster, job, channel_id) (rate(newapi_channel_retries_total[5m])) / clamp_min(sum by (cluster, job, channel_id) (rate(newapi_channel_attempts_total[5m])), 0.000001)

      - record: newapi:channel_attempt_rpm:1m
        expr: sum by (cluster, job, channel_id) (rate(newapi_channel_attempts_total[1m])) * 60

      - record: newapi:channel_failure_rpm:1m
        expr: sum by (cluster, job, channel_id) (rate(newapi_channel_attempts_total{result="failure"}[1m])) * 60

      - record: newapi:channel_retry_rpm:1m
        expr: sum by (cluster, job, channel_id) (rate(newapi_channel_retries_total[1m])) * 60

      - record: newapi:channel_success_ratio:1m
        expr: sum by (cluster, job, channel_id) (rate(newapi_channel_attempts_total{result="success"}[1m])) / clamp_min(sum by (cluster, job, channel_id) (rate(newapi_channel_attempts_total[1m])), 0.000001)

      - record: newapi:channel_timeout_ratio:1m
        expr: sum by (cluster, job, channel_id) (rate(newapi_channel_attempts_total{result="failure",error_type="timeout"}[1m])) / clamp_min(sum by (cluster, job, channel_id) (rate(newapi_channel_attempts_total[1m])), 0.000001)

      - record: newapi:channel_duration_seconds:p90_5m
        expr: histogram_quantile(0.90, sum by (cluster, job, channel_id, le) (rate(newapi_channel_duration_seconds_bucket[5m])))

      - record: newapi:channel_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (cluster, job, channel_id, le) (rate(newapi_channel_duration_seconds_bucket[5m])))

      - record: newapi:channel_ttft_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (cluster, job, channel_id, le) (rate(newapi_channel_ttft_seconds_bucket[5m])))

      - record: newapi:channel_first_byte_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (cluster, job, channel_id, le) (rate(newapi_channel_first_byte_seconds_bucket[5m])))

      - record: newapi:channel_cache_hit_ratio:5m
        expr: sum by (cluster, job, channel_id) (rate(newapi_channel_tokens_total{token_type="cache_read"}[5m])) / clamp_min(sum by (cluster, job, channel_id) (rate(newapi_channel_tokens_total{token_type="input"}[5m])), 0.000001)

      - record: newapi:channel_tokens_per_minute:5m
        expr: sum by (cluster, job, channel_id, token_type) (rate(newapi_channel_tokens_total[5m])) * 60

      - record: newapi:channel_first_token_waiting_overdue
        expr: sum by (cluster, job, channel_id, threshold_seconds) (newapi_channel_stream_first_token_waiting)

      - record: newapi:relay_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (cluster, job, relay_format, le) (rate(newapi_relay_duration_seconds_bucket[5m])))

      - record: newapi:relay_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (cluster, job, relay_format, le) (rate(newapi_relay_duration_seconds_bucket[5m])))

  - name: newapi-infrastructure
    rules:
      - record: newapi:db_pool_utilization:instance
        expr: (max by (cluster, job, instance, database) (newapi_db_connections{state="in_use"}) / max by (cluster, job, instance, database) (newapi_db_max_open_connections)) and on (cluster, job, instance, database) (max by (cluster, job, instance, database) (newapi_db_max_open_connections) > 0)

      - record: newapi:db_wait_increase:5m
        expr: sum by (cluster, job, instance, database) (increase(newapi_db_wait_total[5m]))

      - record: newapi:db_wait_duration_seconds_increase:5m
        expr: sum by (cluster, job, instance, database) (increase(newapi_db_wait_duration_seconds_total[5m]))

      - record: newapi:db_wait_average_seconds:5m
        expr: newapi:db_wait_duration_seconds_increase:5m / clamp_min(newapi:db_wait_increase:5m, 1)

      - record: newapi:go_goroutines_growth_per_second:30m
        expr: max by (cluster, job, instance) (deriv(go_goroutines[30m]))

      - record: newapi:go_heap_alloc_bytes_growth_per_second:30m
        expr: max by (cluster, job, instance) (deriv(go_memstats_heap_alloc_bytes[30m]))

  - name: newapi-billing
    rules:
      - record: newapi:billing_operation_increase:15m
        expr: sum by (cluster, job, operation, billing_source, result) (increase(newapi_billing_operations_total[15m]))

      - record: newapi:billing_operation_total_increase:15m
        expr: sum by (cluster, job) (increase(newapi_billing_operations_total[15m]))

      - record: newapi:billing_failure_increase:15m
        expr: sum by (cluster, job, operation, billing_source, reason) (increase(newapi_billing_failures_total[15m]))

      - record: newapi:billing_failure_ratio:15m
        expr: sum by (cluster, job) (increase(newapi_billing_operations_total{result="error"}[15m])) / clamp_min(sum by (cluster, job) (increase(newapi_billing_operations_total[15m])), 1)

      - record: newapi:subscription_rejection_increase:15m
        expr: sum by (cluster, job, reason) (increase(newapi_subscription_rejections_total[15m]))

      - record: newapi:quota_saturation_increase:15m
        expr: sum by (cluster, job, kind, operation) (increase(newapi_quota_saturation_total[15m]))

  - name: newapi-tasks
    rules:
      - record: newapi:task_submission_rate:5m
        expr: sum by (cluster, job, platform, result) (rate(newapi_task_submissions_total[5m]))

      - record: newapi:task_completion_increase:15m
        expr: sum by (cluster, job, platform, result) (increase(newapi_task_completions_total[15m]))

      - record: newapi:task_completion_success_ratio:15m
        expr: sum by (cluster, job, platform) (increase(newapi_task_completions_total{result="success"}[15m])) / clamp_min(sum by (cluster, job, platform) (increase(newapi_task_completions_total[15m])), 1)

      - record: newapi:task_poll_error_ratio:5m
        expr: sum by (cluster, job, platform) (rate(newapi_task_poll_total{result="error"}[5m])) / clamp_min(sum by (cluster, job, platform) (rate(newapi_task_poll_total[5m])), 0.000001)

      - record: newapi:task_duration_seconds:p50_15m
        expr: histogram_quantile(0.50, sum by (cluster, job, platform, result, le) (rate(newapi_task_duration_seconds_bucket[15m])))

      - record: newapi:task_duration_seconds:p95_15m
        expr: histogram_quantile(0.95, sum by (cluster, job, platform, result, le) (rate(newapi_task_duration_seconds_bucket[15m])))

      - record: newapi:task_queue_size:state
        expr: max by (cluster, job, platform, state) (newapi_task_queue_size)

      - record: newapi:task_queue_total:platform
        expr: sum by (cluster, job, platform) (max by (cluster, job, platform, state) (newapi_task_queue_size))
